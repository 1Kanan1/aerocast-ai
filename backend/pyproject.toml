[project]
name = "aerocast-api"
version = "0.1.0"
description = "AeroCast AI aviation weather API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.118",
    "pydantic-settings>=2.8",
    "sqlalchemy[asyncio]>=2.0.38",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RET", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
