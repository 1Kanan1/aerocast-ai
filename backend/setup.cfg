[mutmut]
# Mutation testing for the modules that carry judgement. A surviving mutant
# is a guarantee no test checks; a test that kills nothing is decoration.
source_paths =
    app/llm
# Prompt text is data, not behaviour; mutating its wording measures nothing.
do_not_mutate =
    app/llm/prompts.py
also_copy =
    app
pytest_add_cli_args_test_selection =
    tests/test_api.py
    tests/test_answer_contract.py
    tests/test_answer_validation.py
    tests/test_fallback.py
    tests/test_guardrails.py
    tests/test_health.py
    tests/test_llm_client.py
    tests/test_providers.py
    tests/test_scope.py
